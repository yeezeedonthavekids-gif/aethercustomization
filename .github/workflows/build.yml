name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Core libraries and tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build Windows integration (cross-compile)
        run: dotnet build src/Aether.WindowsIntegration -c Release
      - name: Test
        run: dotnet test tests/Aether.Tests -c Release --logger "console;verbosity=normal"

  windows:
    name: WinUI app (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build app
        run: dotnet build src/Aether.App/Aether.App.csproj -c Release -p:Platform=x64
      - name: Show XAML compiler diagnostics
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter output.json src/Aether.App/obj | ForEach-Object { Write-Host "== $($_.FullName)"; Get-Content $_.FullName -Raw | Write-Host }
          $compiler = Get-ChildItem -Recurse -Filter XamlCompiler.exe "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk.winui" | Where-Object { $_.FullName -like '*net472*' } | Select-Object -First 1
          $input = Get-ChildItem -Recurse -Filter input.json src/Aether.App/obj | Select-Object -First 1
          if ($compiler -and $input) {
            Push-Location src/Aether.App
            & $compiler.FullName $input.FullName "$env:RUNNER_TEMP\xaml-out.json" 2>&1 | Out-Host
            Pop-Location
            if (Test-Path "$env:RUNNER_TEMP\xaml-out.json") { Get-Content "$env:RUNNER_TEMP\xaml-out.json" -Raw | Write-Host }
          }
      - name: Bisect XAML compiler crash
        if: failure()
        shell: pwsh
        run: |
          $files = Get-ChildItem src/Aether.App/Views -Filter *.xaml | ForEach-Object { "Views\$($_.Name)" }
          foreach ($f in @("NONE") + $files) {
            $arg = if ($f -eq "NONE") { "-p:XamlOnly=Views\__none__.xaml" } else { "-p:XamlOnly=$f" }
            $out = dotnet build src/Aether.App/Aether.App.csproj -c Release -p:Platform=x64 $arg 2>&1 | Out-String
            $crash = $out -match "XamlCompiler.exe.*exited with code"
            $wmc = ($out -split "`n" | Where-Object { $_ -match "error WMC|error CS|error XLS" } | Select-Object -First 6) -join "`n"
            Write-Host ("{0,-40} {1}" -f $f, $(if ($crash) { "XAML COMPILER CRASH" } else { "ok" }))
            if ($wmc) { Write-Host $wmc }
          }
      - name: Test on Windows
        run: dotnet test tests/Aether.Tests -c Release
      - name: Smoke test (launch, visit every page, exit)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter Aether.exe src/Aether.App/bin/x64/Release | Select-Object -First 1
          if (-not $exe) { throw "Aether.exe not found" }
          $report = Join-Path $env:RUNNER_TEMP "smoke.txt"
          $env:AETHER_DATA = Join-Path $env:RUNNER_TEMP "aether-data"
          $p = Start-Process $exe.FullName -ArgumentList "--smoke-test `"$report`"" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Smoke test timed out" }
          if (Test-Path $report) { Get-Content $report }
          Get-ChildItem "$env:AETHER_DATA/logs" -ErrorAction SilentlyContinue | ForEach-Object { Get-Content $_.FullName -Tail 80 }
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
